name: Build Redmi 9A Kernel 4.19

on:
  workflow_dispatch:

jobs:
  build:
  
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Environment & Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache flex g++-aarch64-linux-gnu gcc-aarch64-linux-gnu git libssl-dev libncurses5-dev wget

    - name: Clone Kernel Source Xiaomi MT6765
      run: |
        git clone https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git -b dandelion-q-oss --depth=1 kernel

    - name: Fix DTC yylloc, Python DrvGen & Disable Werror
      run: |
        cd kernel
        # 1. Perbaiki yylloc di file DTC compiler untuk GCC modern
        sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.l || true
        sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.lex.c_shipped || true
        
        # 2. Ubah sintaks print Python 2 di DrvGen.py agar kompatibel dengan Python 3
        sed -i 's/print /print(/g' tools/dct/DrvGen.py || true

        # 3. Matikan Werror secara global di Makefile utama agar warning tidak menjadi error fatal
        sed -i 's/-Werror//g' Makefile || true

    - name: Setup Toolchain & Compile Kernel
      run: |
        cd kernel
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export HOSTCFLAGS="-fcommon"
        
        # Buat konfigurasi default untuk perangkat dandelion
        make dandelion_defconfig
        
        # Mulai proses kompilasi dengan mengabaikan sisa warning Werror
        make -j$(nproc) HOSTCFLAGS="-fcommon" KCFLAGS="-Wno-array-compare -Wno-error=array-compare" Image.gz-dtb || make -j$(nproc) HOSTCFLAGS="-fcommon" KCFLAGS="-Wno-array-compare -Wno-error=array-compare" Image

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Redmi-9A-Kernel-Image
        path: kernel/arch/arm64/boot/Image*
