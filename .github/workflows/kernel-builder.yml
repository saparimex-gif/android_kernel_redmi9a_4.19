name: Build Redmi 9A Kernel 4.19

on:
  workflow_dispatch:

jobs:
  build:
  
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v3

    - name: Setup Environment & Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache flex g++-aarch64-linux-gnu gcc-aarch64-linux-gnu git libssl-dev libncurses5-dev wget python3

    - name: Clone Kernel Source Xiaomi MT6765
      run: |
        git clone https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git -b dandelion-q-oss --depth=1 kernel

    - name: Fix Python 3 & DTC Compatibility Errors
      run: |
        cd kernel
        # 1. Perbaiki sintaks print Python 2 ke Python 3 di DrvGen.py
        sed -i 's/print /print(/g' tools/dct/DrvGen.py || true
        
        # 2. Perbaiki multiple definition yylloc di DTC compiler untuk GCC modern
        sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.lex.c || true

    - name: Setup Toolchain & Compile Kernel
      run: |
        cd kernel
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        
        # Buat konfigurasi default untuk perangkat dandelion
        make dandelion_defconfig || make mediatek_defconfig || make defconfig
        
        # Mulai proses kompilasi
        make -j$(nproc) Image.gz-dtb || make -j$(nproc) Image

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Redmi-9A-Kernel-Image
        path: kernel/arch/arm64/boot/Image*
