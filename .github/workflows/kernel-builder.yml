name: Build Redmi 9A Kernel 4.19

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Environment & Dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache flex \
            g++-aarch64-linux-gnu gcc-aarch64-linux-gnu \
            git libssl-dev libncurses5-dev wget python3

      - name: Clone Kernel Source Xiaomi MT6765
        run: |
          git clone https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git \
            -b dandelion-q-oss --depth=1 kernel

      - name: Fix build compatibility
        run: |
          set -euxo pipefail
          cd kernel

          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.l
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.lex.c_shipped

          cat > fix_python.py <<'PY'
          from pathlib import Path
          import re
          import sys
          import traceback

          dct_dir = Path("tools/dct")
          drvgen = dct_dir / "DrvGen.py"

          if drvgen.exists():
              text = drvgen.read_text(encoding="utf-8", errors="replace")

              # Fix the old triple-quoted print banner.
              text = text.replace("print '''", 'print("""')
              text = text.replace("\n'''", '\n"""')

              # Convert Python 2 print statements.
              text = re.sub(
                  r"(?m)^(\s*)print\s+(.+)$",
                  lambda m: m.group(1) + "print(" + m.group(2) + ")",
                  text
              )

              drvgen.write_text(text, encoding="utf-8")

          converted = 0
          failed = []

          for py_file in dct_dir.rglob("*.py"):
              source = py_file.read_text(encoding="utf-8", errors="replace")

              # Convert the remaining Python 2 print statements safely.
              source = re.sub(
                  r"(?m)^(\s*)print\s+([^(].*)$",
                  lambda m: m.group(1) + "print(" + m.group(2) + ")",
                  source
              )

              # Python 2 exception syntax: except Exception, e:
              source = re.sub(
                  r"except\s+([A-Za-z_][\w.]*)\s*,\s*([A-Za-z_]\w*):",
                  r"except \1 as \2:",
                  source
              )

              py_file.write_text(source, encoding="utf-8")
              converted += 1

          print(f"Processed {converted} Python files.")

          # Report syntax errors, but do not stop the build here.
          for py_file in dct_dir.rglob("*.py"):
              compile(py_file.read_text(encoding="utf-8", errors="replace"),
                      str(py_file), "exec")
          PY

          python3 fix_python.py

          mkdir -p drivers/devfreq
          touch -a drivers/devfreq/helio-dvfsrc.h

          sed -i 's/-Werror//g' Makefile
          echo 'KBUILD_CFLAGS += -w' >> Makefile
          echo 'CFLAGS_helio-dvfsrc-opp.o += -I$(srctree)/drivers/devfreq' >> drivers/devfreq/Makefile

      - name: Setup Toolchain & Compile Kernel
        run: |
          set -euxo pipefail
          cd kernel

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export PYTHONPATH="$(pwd)/tools/dct:$(pwd)/tools/dct/obj:${PYTHONPATH:-}"

          make dandelion_defconfig
          ./scripts/config --disable CONFIG_CC_STACKPROTECTOR
          ./scripts/config --disable CONFIG_CC_STACKPROTECTOR_NONE
          ./scripts/config --disable CONFIG_CC_STACKPROTECTOR_REGULAR
          ./scripts/config --disable CONFIG_CC_STACKPROTECTOR_STRONG
          ./scripts/config --disable CONFIG_STACKPROTECTOR
          make olddefconfig

          make -j$(nproc) HOSTCFLAGS="-fcommon" KCFLAGS="-w" \
            Image.gz-dtb || \
          make -j$(nproc) HOSTCFLAGS="-fcommon" KCFLAGS="-w" Image

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Redmi-9A-Kernel-Image
          path: kernel/arch/arm64/boot/Image*
