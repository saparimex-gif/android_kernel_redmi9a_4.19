name: Build NetHunter Kernel Redmi 9A (4.19)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git \
            libelf-dev libssl-dev lld llvm python3 python-is-python3 \
            unzip wget zip zlib1g-dev zstd

      - name: Configure Git for Large Clones & Retries
        run: |
          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 524288000
          git config --global core.compression 0

      - name: Clone Kernel Source 4.19 (blossom / Redmi 9A)
        run: |
          for i in 1 2 3 4 5; do
            echo "Cloning kernel source (percobaan ke-$i)..."
            rm -rf kernel
            if git clone --depth=1 --single-branch https://github.com/IsHacker-kernel/android_kernel_xiaomi_blossom.git kernel; then
              break
            fi
            sleep 5
            if [ "$i" -eq 5 ]; then
              echo "Gagal clone kernel source setelah 5 percobaan."
              exit 1
            fi
          done

      - name: Clone AOSP Clang Toolchain
        run: |
          for i in 1 2 3 4 5; do
            echo "Cloning toolchain_aosp_clang (percobaan ke-$i)..."
            rm -rf clang
            if git clone --depth=1 --single-branch https://github.com/IsHacker-kernel/toolchain_aosp_clang.git clang; then
              break
            fi
            sleep 5
            if [ "$i" -eq 5 ]; then
              echo "Gagal clone toolchain_aosp_clang setelah 5 percobaan."
              exit 1
            fi
          done

      - name: Clone Kali NetHunter Kernel Builder (Patches)
        run: |
          for i in 1 2 3 4 5; do
            echo "Cloning kali-nethunter-kernel dari GitLab (percobaan ke-$i)..."
            rm -rf nh-builder
            if git clone --depth=1 --single-branch https://gitlab.com/kalilinux/nethunter/build-scripts/kali-nethunter-kernel.git nh-builder; then
              break
            fi
            sleep 5
            if [ "$i" -eq 5 ]; then
              echo "Gagal clone kali-nethunter-kernel dari GitLab setelah 5 percobaan."
              exit 1
            fi
          done

      - name: Detect Defconfig, Patch & Apply NetHunter Configs
        env:
          ARCH: arm64
          SUBARCH: arm64
        run: |
          cd kernel

          if [ -f "ipc/msg.c" ]; then
            sed -i '1285,1305s/return -EINVAL;/return;/g; 1285,1305s/\breturn err;/return;/g' ipc/msg.c
          fi
          if [ -f "ipc/sem.c" ]; then
            sed -i '235,255s/return 0;/return;/g' ipc/sem.c
          fi

          if [ ! -f "drivers/android/lowmemorykiller.c" ] && [ -f "drivers/android/Makefile" ]; then
            sed -i '/lowmemorykiller\.o/d' drivers/android/Makefile
          fi

          # Cari & deduplikasi semua makro initcall yang mendaftarkan deadline_init
          echo "=== Baris initcall deadline_init sebelum deduplikasi ==="
          grep -rn "deadline_init" kernel/ init/ drivers/ 2>/dev/null || true

          for f in $(grep -rl "deadline_init" kernel/ init/ drivers/ 2>/dev/null || true); do
            awk '
              /initcall.*\(.*deadline_init.*\)/ {
                c++
                if (c > 1) {
                  print "/* REMOVED DUPLICATE INITCALL: " $0 " */"
                  next
                }
              }
              { print }
            ' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done

          echo "=== Baris initcall deadline_init setelah deduplikasi ==="
          grep -rn "deadline_init" kernel/ init/ drivers/ 2>/dev/null || true

          DEFCONFIG_PATH=$(find arch/arm64/configs -type f \( -name "*blossom*defconfig" -o -name "*dandelion*defconfig" -o -name "*mt6765*defconfig" \) | head -n 1)
          if [ -z "$DEFCONFIG_PATH" ]; then
            echo "Defconfig spesifik tidak ditemukan!"
            find arch/arm64/configs -maxdepth 2 -type f
            exit 1
          fi

          DEFCONFIG=${DEFCONFIG_PATH#arch/arm64/configs/}
          echo "DEFCONFIG=$DEFCONFIG" >> $GITHUB_ENV
          echo "Menggunakan defconfig: $DEFCONFIG"

          patch -p1 --forward < "$GITHUB_WORKSPACE/nh-builder/patches/4.19/add-wifi-injection-4.14.patch" || true
          patch -p1 --forward < "$GITHUB_WORKSPACE/nh-builder/patches/4.19/add-hid-gadget-4.19.patch" || true

          find . -name "*.rej" -delete
          find . -name "*.orig" -delete

          yes "n" | make -j$(nproc) O=out ARCH=arm64 "$DEFCONFIG"

          ./scripts/config --file out/.config \
            -d LTO_CLANG \
            -d CONFIG_LTO_CLANG \
            -d RELR \
            -d CONFIG_RELR \
            -d ANDROID_LOW_MEMORY_KILLER \
            -d CONFIG_ANDROID_LOW_MEMORY_KILLER \
            -e MODULES \
            -e MODULE_UNLOAD \
            -e CFG80211 \
            -e CFG80211_WEXT \
            -e MAC80211 \
            -e MAC80211_MESH \
            -e USB_GADGET \
            -e USB_CONFIGFS \
            -e USB_CONFIGFS_F_HID \
            -e USB_G_HID \
            -e HID_GENERIC \
            -e USB_HIDDEV \
            -m ATH9K_HTC \
            -m RT2800USB \
            -m RTL8187 \
            -m RTL8XXXU \
            -m BT_HCIBTUSB \
            -m MEDIA_SUPPORT \
            -m MEDIA_SDR_SUPPORT

          sed -i 's/^CONFIG_ANDROID_LOW_MEMORY_KILLER=.*/# CONFIG_ANDROID_LOW_MEMORY_KILLER is not set/' out/.config

          yes "n" | make -j$(nproc) O=out ARCH=arm64 olddefconfig || true
          sed -i 's/^CONFIG_ANDROID_LOW_MEMORY_KILLER=.*/# CONFIG_ANDROID_LOW_MEMORY_KILLER is not set/' out/.config

      - name: Compile Kernel
        env:
          ARCH: arm64
          SUBARCH: arm64
        run: |
          cd kernel
          CLANG_BIN=$(find "$GITHUB_WORKSPACE/clang" -maxdepth 4 -type f -name "clang" | head -n 1 | xargs dirname)
          export PATH="$CLANG_BIN:$PATH"
          echo "Menggunakan Clang dari: $CLANG_BIN"

          set -o pipefail
          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1 2>&1 | tee build.log || {
              echo "=== RE-RUN SINGLE THREAD UNTUK MENANGKAP ERROR ASLI ==="
              make -j1 O=out \
                ARCH=arm64 \
                CC=clang \
                CLANG_TRIPLE=aarch64-linux-gnu- \
                CROSS_COMPILE=aarch64-linux-gnu- \
                CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                LLVM=1 \
                LLVM_IAS=1 2>&1 | tail -n 80 || true
              exit 1
            }

      - name: Package with AnyKernel3
        run: |
          cd "$GITHUB_WORKSPACE"
          for i in 1 2 3; do
            rm -rf anykernel
            git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel && break
            sleep 5
          done

          sed -i 's/device.name1=.*/device.name1=dandelion/' anykernel/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=blossom/' anykernel/anykernel.sh
          sed -i 's|block=.*|block=/dev/block/by-name/boot;|' anykernel/anykernel.sh

          BOOT_DIR="$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot"
          if [ -f "$BOOT_DIR/Image.gz-dtb" ]; then
            cp "$BOOT_DIR/Image.gz-dtb" anykernel/
          elif [ -f "$BOOT_DIR/Image.gz" ]; then
            cp "$BOOT_DIR/Image.gz" anykernel/
            [ -f "$BOOT_DIR/dtb.img" ] && cp "$BOOT_DIR/dtb.img" anykernel/
            [ -f "$BOOT_DIR/dtbo.img" ] && cp "$BOOT_DIR/dtbo.img" anykernel/
          else
            echo "File kernel image tidak ditemukan!"
            ls -la "$BOOT_DIR"
            exit 1
          fi

          cd anykernel
          zip -r9 "$GITHUB_WORKSPACE/NetHunter-Kernel-Redmi9A-4.19.zip" * -x .git README.md *placeholder

      - name: Upload NetHunter Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-Kernel-Redmi9A
          path: NetHunter-Kernel-Redmi9A-4.19.zip
          retention-days: 14
