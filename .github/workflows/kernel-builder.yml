name: Build Redmi 9A Kernel 4.19

on:
  workflow_dispatch:

jobs:
  build:
  
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Environment & Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache flex g++-aarch64-linux-gnu gcc-aarch64-linux-gnu git libssl-dev libncurses5-dev wget python3

    - name: Clone Kernel Source Xiaomi MT6765
      run: |
        git clone https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git -b dandelion-q-oss --depth=1 kernel

    - name: Fix DrvGen Python Syntax, Missing Header & Warnings
      run: |
        set -euxo pipefail
        cd kernel
        
        # 1. Perbaiki yylloc di file DTC compiler
        sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.l
        sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.lex.c_shipped
        
        # 2. Perbaiki sintaks print yang rusak secara spesifik di DrvGen.py
        cat << 'EOF' > fix_drvgen.py
        import re

        path = "tools/dct/DrvGen.py"
        with open(path, "r", encoding="utf-8", errors="ignore") as f:
            content = f.read()

        # Tangani print statement bermasalah seperti print(''') atau print pernyataan lama
        content = content.replace("print('''", "print(\"\"\"")
        content = content.replace("print('''')","print(\"\")")
        content = re.sub(r'\bprint\s+([^\(\n]+)', r'print(\1)', content)

        with open(path, "w", encoding="utf-8") as f:
            f.write(content)
        EOF
        
        python3 fix_drvgen.py
        python3 -m py_compile tools/dct/DrvGen.py

        # 3. Sediakan header helio-dvfsrc.h
        mkdir -p drivers/devfreq
        if [ ! -f "drivers/devfreq/helio-dvfsrc.h" ]; then
            touch drivers/devfreq/helio-dvfsrc.h
        fi

        # 4. Bersihkan -Werror dan matikan warning ketat
        sed -i 's/-Werror//g' Makefile
        echo 'KBUILD_CFLAGS += -w' >> Makefile
        echo 'CFLAGS_helio-dvfsrc-opp.o += -I$(srctree)/drivers/devfreq' >> drivers/devfreq/Makefile

    - name: Setup Toolchain & Compile Kernel
      run: |
        set -euxo pipefail
        cd kernel
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export PYTHONPATH="$(pwd)/tools/dct:$(pwd)/tools/dct/obj:${PYTHONPATH:-}"
        
        # Buat konfigurasi default
        make dandelion_defconfig
        
        # Nonaktifkan opsi stack protector agar lolos prepare-compiler-check
        ./scripts/config --disable CONFIG_CC_STACKPROTECTOR
        ./scripts/config --disable CONFIG_CC_STACKPROTECTOR_NONE
        ./scripts/config --disable CONFIG_CC_STACKPROTECTOR_REGULAR
        ./scripts/config --disable CONFIG_CC_STACKPROTECTOR_STRONG
        ./scripts/config --disable CONFIG_STACKPROTECTOR
        make olddefconfig
        
        # Mulai proses kompilasi
        make -j$(nproc) HOSTCFLAGS="-fcommon" KCFLAGS="-w" Image.gz-dtb || make -j$(nproc) HOSTCFLAGS="-fcommon" KCFLAGS="-w" Image

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Redmi-9A-Kernel-Image
        path: kernel/arch/arm64/boot/Image*
