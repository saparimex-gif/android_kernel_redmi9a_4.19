name: Build Redmi 9A Kernel 4.19

on:
  workflow_dispatch:

jobs:
  build:
  
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Environment & Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache flex g++-aarch64-linux-gnu gcc-aarch64-linux-gnu git libssl-dev libncurses5-dev wget python3

    - name: Clone Kernel Source Xiaomi MT6765
      run: |
        git clone https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git -b dandelion-q-oss --depth=1 kernel

    - name: Fix Compiler Flags, DTC yylloc & Python Compatibility
      run: |
        cd kernel
        # 1. Perbaiki yylloc di file DTC compiler
        sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.l || true
        sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.lex.c_shipped || true
        
        # 2. Perbaiki sintaks print & modul ConfigParser (ubah ke configparser agar kompatibel dengan Python 3)
        find tools/dct/ -type f -name "*.py" -exec sed -i 's/import ConfigParser/import configparser as ConfigParser/g' {} + || true
        python3 -c '
        import glob
        for filepath in glob.glob("tools/dct/**/*.py", recursive=True):
            with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                code = f.read()
            code = code.replace("print \x27\x27\x27", "print(\x27\x27\x27").replace("\x27\x27\x27\n", "\x27\x27\x27)\n")
            with open(filepath, "w", encoding="utf-8", errors="ignore") as f:
                f.write(code)
        ' || true

        # 3. Buat direktori penunjang modul dct agar GpioObj terbaca dengan benar
        mkdir -p tools/dct/obj || true
        touch tools/dct/__init__.py tools/dct/obj/__init__.py || true

        # 4. Bersihkan -Werror dan pastikan tidak ada flag -implicit-function-declaration yang salah format
        sed -i 's/-Werror//g' Makefile || true
        sed -i 's/-implicit-function-declaration//g' Makefile || true
        echo 'KBUILD_CFLAGS += -Wno-array-bounds -Wno-error=array-bounds -Wno-array-compare -Wno-error=array-compare -Wno-error=implicit-function-declaration' >> Makefile

    - name: Setup Toolchain & Compile Kernel
      run: |
        cd kernel
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        
        # Ekspor PYTHONPATH agar skrip DrvGen menemukan modul internalnya
        export PYTHONPATH="$(pwd)/tools/dct:$(pwd)/tools/dct/obj:$PYTHONPATH"
        
        # Buat konfigurasi default
        make dandelion_defconfig
        
        # Nonaktifkan opsi stack protector yang tidak didukung compiler modern agar lolos prepare-compiler-check
        ./scripts/config --disable CONFIG_CC_STACKPROTECTOR
        ./scripts/config --disable CONFIG_CC_STACKPROTECTOR_NONE
        ./scripts/config --disable CONFIG_CC_STACKPROTECTOR_REGULAR
        ./scripts/config --disable CONFIG_CC_STACKPROTECTOR_STRONG
        ./scripts/config --disable CONFIG_STACKPROTECTOR
        make olddefconfig
        
        # Mulai proses kompilasi
        make -j$(nproc) HOSTCFLAGS="-fcommon" PYTHONPATH="$(pwd)/tools/dct:$(pwd)/tools/dct/obj" Image.gz-dtb || make -j$(nproc) HOSTCFLAGS="-fcommon" PYTHONPATH="$(pwd)/tools/dct:$(pwd)/tools/dct/obj" Image

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Redmi-9A-Kernel-Image
        path: kernel/arch/arm64/boot/Image*
