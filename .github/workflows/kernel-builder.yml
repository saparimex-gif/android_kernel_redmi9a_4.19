name: Build Kernel Redmi 9A - Full USB & BT Arsenal (4.19)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git \
            libelf-dev libssl-dev lld llvm python3 python-is-python3 \
            unzip wget zip zlib1g-dev zstd

      - name: Configure Git for Large Clones & Retries
        run: |
          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 524288000
          git config --global core.compression 0

      - name: Clone Kernel Source 4.19 (blossom / Redmi 9A)
        run: |
          for i in 1 2 3 4 5; do
            echo "Cloning kernel source (percobaan ke-$i)..."
            rm -rf kernel
            if git clone --depth=1 --single-branch https://github.com/IsHacker-kernel/android_kernel_xiaomi_blossom.git kernel; then
              break
            fi
            sleep 5
            if [ "$i" -eq 5 ]; then
              echo "Gagal clone kernel source setelah 5 percobaan."
              exit 1
            fi
          done

      - name: Clone AOSP Clang Toolchain
        run: |
          for i in 1 2 3 4 5; do
            echo "Cloning toolchain_aosp_clang (percobaan ke-$i)..."
            rm -rf clang
            if git clone --depth=1 --single-branch https://github.com/IsHacker-kernel/toolchain_aosp_clang.git clang; then
              break
            fi
            sleep 5
            if [ "$i" -eq 5 ]; then
              echo "Gagal clone toolchain_aosp_clang setelah 5 percobaan."
              exit 1
            fi
          done

      - name: Prepare Defconfig with Full USB Arsenal & BT Support
        env:
          ARCH: arm64
          SUBARCH: arm64
        run: |
          cd kernel

          if [ ! -f "drivers/android/lowmemorykiller.c" ] && [ -f "drivers/android/Makefile" ]; then
            sed -i '/lowmemorykiller\.o/d' drivers/android/Makefile
          fi

          DEFCONFIG_PATH=$(find arch/arm64/configs -type f \( -name "*blossom*defconfig" -o -name "*dandelion*defconfig" -o -name "*mt6765*defconfig" \) | head -n 1)
          if [ -z "$DEFCONFIG_PATH" ]; then
            echo "Defconfig spesifik tidak ditemukan!"
            find arch/arm64/configs -maxdepth 2 -type f
            exit 1
          fi

          DEFCONFIG=${DEFCONFIG_PATH#arch/arm64/configs/}
          echo "DEFCONFIG=$DEFCONFIG" >> $GITHUB_ENV
          echo "Menggunakan defconfig: $DEFCONFIG"

          yes "n" | make -j$(nproc) O=out ARCH=arm64 "$DEFCONFIG"

          ./scripts/config --file out/.config \
            -d LTO_CLANG \
            -d CONFIG_LTO_CLANG \
            -d RELR \
            -d CONFIG_RELR \
            -d ANDROID_LOW_MEMORY_KILLER \
            -d CONFIG_ANDROID_LOW_MEMORY_KILLER \
            -d IOSCHED_DEADLINE \
            -d CONFIG_IOSCHED_DEADLINE \
            -e BT \
            -e BT_BREDR \
            -e BT_LE \
            -e BT_RFCOMM \
            -e BT_RFCOMM_TTY \
            -e BT_BNEP \
            -e BT_HIDP \
            -e BT_HCIBTUSB \
            -e BT_HCIBTUSB_BCM \
            -e BT_HCIBTUSB_RTL \
            -e BT_HCIUART \
            -e BT_HCIUART_H4 \
            -e BT_HCIVHCI \
            -e USB_GADGET \
            -e USB_CONFIGFS \
            -e USB_CONFIGFS_F_HID \
            -e USB_CONFIGFS_RNDIS \
            -e USB_CONFIGFS_ECM \
            -e USB_CONFIGFS_NCM \
            -e USB_CONFIGFS_MASS_STORAGE \
            -e USB_CONFIGFS_F_FS \
            -e USB_CONFIGFS_SERIAL \
            -e USB_CONFIGFS_ACM \
            -e IKCONFIG \
            -e IKCONFIG_PROC

          sed -i 's/^CONFIG_ANDROID_LOW_MEMORY_KILLER=.*/# CONFIG_ANDROID_LOW_MEMORY_KILLER is not set/' out/.config
          sed -i 's/^CONFIG_IOSCHED_DEADLINE=.*/# CONFIG_IOSCHED_DEADLINE is not set/' out/.config

          yes "n" | make -j$(nproc) O=out ARCH=arm64 olddefconfig || true
          sed -i 's/^CONFIG_ANDROID_LOW_MEMORY_KILLER=.*/# CONFIG_ANDROID_LOW_MEMORY_KILLER is not set/' out/.config
          sed -i 's/^CONFIG_IOSCHED_DEADLINE=.*/# CONFIG_IOSCHED_DEADLINE is not set/' out/.config

          echo "=== Verifikasi Config USB Gadget & Bluetooth ==="
          grep -E "^(CONFIG_USB_GADGET|CONFIG_USB_CONFIGFS|CONFIG_USB_CONFIGFS_F_HID|CONFIG_USB_CONFIGFS_RNDIS|CONFIG_USB_CONFIGFS_ECM|CONFIG_USB_CONFIGFS_NCM|CONFIG_USB_CONFIGFS_MASS_STORAGE|CONFIG_USB_CONFIGFS_F_FS|CONFIG_USB_CONFIGFS_SERIAL|CONFIG_USB_CONFIGFS_ACM|CONFIG_BT_HCIBTUSB)=" out/.config || true

      - name: Compile Kernel
        env:
          ARCH: arm64
          SUBARCH: arm64
        run: |
          cd kernel
          CLANG_BIN=$(find "$GITHUB_WORKSPACE/clang" -maxdepth 4 -type f -name "clang" | head -n 1 | xargs dirname)
          export PATH="$CLANG_BIN:$PATH"
          echo "Menggunakan Clang dari: $CLANG_BIN"

          set -o pipefail
          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1 2>&1 | tee build.log || {
              make -j1 O=out \
                ARCH=arm64 \
                CC=clang \
                CLANG_TRIPLE=aarch64-linux-gnu- \
                CROSS_COMPILE=aarch64-linux-gnu- \
                CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                LLVM=1 \
                LLVM_IAS=1 2>&1 | tail -n 80 || true
              exit 1
            }

          echo "=== Isi arch/arm64/boot ==="
          ls -lh out/arch/arm64/boot/ | grep -E "Image|dtb|dtbo" || ls -lh out/arch/arm64/boot/

      - name: Package Kernel with AnyKernel3
        run: |
          cd "$GITHUB_WORKSPACE"
          for i in 1 2 3; do
            rm -rf anykernel
            git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel && break
            sleep 5
          done

          sed -i 's/device\.name1=.*/device.name1=dandelion/' anykernel/anykernel.sh
          sed -i 's/device\.name2=.*/device.name2=blossom/' anykernel/anykernel.sh
          sed -i 's/device\.name3=.*/device.name3=/' anykernel/anykernel.sh
          sed -i 's/device\.name4=.*/device.name4=/' anykernel/anykernel.sh
          sed -i 's|^[[:space:]]*BLOCK=.*|BLOCK=boot;|' anykernel/anykernel.sh

          BOOT_DIR="$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot"
          if [ -f "$BOOT_DIR/Image.gz-dtb" ]; then
            cp "$BOOT_DIR/Image.gz-dtb" anykernel/
          elif [ -f "$BOOT_DIR/Image.gz" ]; then
            cp "$BOOT_DIR/Image.gz" anykernel/
            [ -f "$BOOT_DIR/dtb.img" ] && cp "$BOOT_DIR/dtb.img" anykernel/
            [ -f "$BOOT_DIR/dtbo.img" ] && cp "$BOOT_DIR/dtbo.img" anykernel/
          else
            echo "File kernel image tidak ditemukan!"
            exit 1
          fi

          cd anykernel
          zip -r9 "$GITHUB_WORKSPACE/NetHunter-USB-BT-Kernel-Redmi9A-4.19.zip" * -x .git README.md *placeholder

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-USB-BT-Kernel-Redmi9A
          path: NetHunter-USB-BT-Kernel-Redmi9A-4.19.zip
          retention-days: 14
