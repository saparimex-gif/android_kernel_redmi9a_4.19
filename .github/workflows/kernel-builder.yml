name: Build Blossom Stock Test Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libssl-dev libncurses5-dev lz4 python3 python-is-python3 zip

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 -b 4.19.325-universal https://github.com/plmzaq2112/blossom-4.19-universal.git kernel

      - name: Clone Proton-Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Configure and Build (Stock Defconfig)
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          make O=out ARCH=arm64 blossom_defconfig
          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-unknown-warning-option" \
            Image.gz dtbs

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blossom-stock-test-4.19.325
          path: |
            kernel/out/arch/arm64/boot/Image.gz
            kernel/out/arch/arm64/boot/Image
            kernel/out/arch/arm64/boot/dts/**/*.dtb
