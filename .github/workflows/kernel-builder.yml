name: Build Redmi 9A Kernel 4.19

on:
  workflow_dispatch:

jobs:
  build:
  
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Environment & Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache flex g++-aarch64-linux-gnu gcc-aarch64-linux-gnu git libssl-dev libncurses5-dev wget python3

    - name: Clone Kernel Source Xiaomi MT6765
      run: |
        git clone https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git -b dandelion-q-oss --depth=1 kernel

    - name: Fix Compiler Flags, DTC yylloc & Python DrvGen
      run: |
        cd kernel
        # 1. Perbaiki yylloc di file DTC compiler
        sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.l || true
        sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.lex.c_shipped || true
        
        # 2. Perbaiki sintaks print Python di DrvGen.py
        python3 -c '
        with open("tools/dct/DrvGen.py", "r") as f:
            code = f.read()
        code = code.replace("print \x27\x27\x27", "print(\x27\x27\x27").replace("\x27\x27\x27\n", "\x27\x27\x27)\n")
        with open("tools/dct/DrvGen.py", "w") as f:
            f.write(code)
        ' || true

        # 3. Hapus flag -implicit-function-declaration yang salah format di Makefile utama
        sed -i 's/-implicit-function-declaration/-Wimplicit-function-declaration/g' Makefile || true
        sed -i 's/-Werror//g' Makefile || true
        echo 'KBUILD_CFLAGS += -Wno-array-compare -Wno-error=array-compare -Wno-error=implicit-function-declaration' >> Makefile

    - name: Setup Toolchain & Compile Kernel
      run: |
        cd kernel
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        
        # Tambahkan path direktori tools/dct agar Python menemukan modul GpioObj
        export PYTHONPATH=$PYTHONPATH:$(pwd)/tools/dct
        
        # Buat konfigurasi default
        make dandelion_defconfig
        
        # Mulai proses kompilasi
        make -j$(nproc) HOSTCFLAGS="-fcommon" PYTHONPATH=$(pwd)/tools/dct Image.gz-dtb || make -j$(nproc) HOSTCFLAGS="-fcommon" PYTHONPATH=$(pwd)/tools/dct Image

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Redmi-9A-Kernel-Image
        path: kernel/arch/arm64/boot/Image*
