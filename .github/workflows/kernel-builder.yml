name: Build Redmi 9A Kernel 4.19

on:
  workflow_dispatch:

jobs:
  build:
  
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Environment & Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache flex g++-aarch64-linux-gnu gcc-aarch64-linux-gnu git libssl-dev libncurses5-dev wget python3

    - name: Clone Kernel Source Xiaomi MT6765
      run: |
        git clone https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git -b dandelion-q-oss --depth=1 kernel

    - name: Fix DTC yylloc, Python Path & Compiler Warnings
      run: |
        cd kernel
        # 1. Perbaiki yylloc di file DTC compiler
        sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.l || true
        sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.lex.c_shipped || true
        
        # 2. Perbaiki sintaks print Python di DrvGen.py
        python3 -c '
        with open("tools/dct/DrvGen.py", "r") as f:
            code = f.read()
        code = code.replace("print \x27\x27\x27", "print(\x27\x27\x27").replace("\x27\x27\x27\n", "\x27\x27\x27)\n")
        with open("tools/dct/DrvGen.py", "w") as f:
            f.write(code)
        ' || true

        # 3. Buat direktori penunjang modul dct agar GpioObj terbaca dengan benar
        mkdir -p tools/dct/obj || true
        touch tools/dct/__init__.py tools/dct/obj/__init__.py || true

        # 4. Matikan seluruh jenis Werror secara agresif dan abaikan array-bounds serta implicit-function-declaration
        sed -i 's/-Werror//g' Makefile || true
        echo 'KBUILD_CFLAGS += -Wno-array-bounds -Wno-error=array-bounds -Wno-array-compare -Wno-error=array-compare -Wno-error=implicit-function-declaration -w' >> Makefile

    - name: Setup Toolchain & Compile Kernel
      run: |
        cd kernel
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        
        # Ekspor PYTHONPATH agar skrip DrvGen menemukan modul internalnya
        export PYTHONPATH="$(pwd)/tools/dct:$(pwd)/tools/dct/obj:$PYTHONPATH"
        
        # Buat konfigurasi default
        make dandelion_defconfig
        
        # Mulai proses kompilasi dengan menyertakan PYTHONPATH global
        make -j$(nproc) HOSTCFLAGS="-fcommon" PYTHONPATH="$(pwd)/tools/dct:$(pwd)/tools/dct/obj" Image.gz-dtb || make -j$(nproc) HOSTCFLAGS="-fcommon" PYTHONPATH="$(pwd)/tools/dct:$(pwd)/tools/dct/obj" Image

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Redmi-9A-Kernel-Image
        path: kernel/arch/arm64/boot/Image*
