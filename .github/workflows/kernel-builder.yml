name: Build NetHunter Kernel Redmi 9A (4.19)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git \
            libelf-dev libssl-dev lld llvm python3 python-is-python3 \
            unzip wget zip zlib1g-dev zstd

      - name: Clone Kernel Source 4.19 (blossom / Redmi 9A)
        run: |
          git clone --depth=1 https://github.com/IsHacker-kernel/android_kernel_xiaomi_blossom.git kernel

      - name: Setup Neutron Clang (Modern Clang)
        run: |
          mkdir -p clang && cd clang
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S=latest

      - name: Clone Kali NetHunter Kernel Builder (Patches)
        run: |
          git clone --depth=1 https://gitlab.com/kalilinux/nethunter/build-scripts/kali-nethunter-kernel.git nh-builder

      - name: Detect Defconfig, Patch & Apply NetHunter Configs
        env:
          ARCH: arm64
          SUBARCH: arm64
        run: |
          cd kernel

          # 1. Bersihkan flag compiler spesifik jika ada yang tidak didukung
          sed -i 's/-mllvm -inline-instr-cost=[0-9]*//g' Makefile
          sed -i 's/-mllvm -inline-call-penalty=[0-9]*//g' Makefile
          sed -i 's/-inline-instr-cost=[0-9]*//g' Makefile
          sed -i 's/-inline-call-penalty=[0-9]*//g' Makefile

          # 2. Cari file defconfig
          DEFCONFIG_PATH=$(find arch/arm64/configs -type f \( -name "*blossom*defconfig" -o -name "*dandelion*defconfig" -o -name "*mt6765*defconfig" \) | head -n 1)
          if [ -z "$DEFCONFIG_PATH" ]; then
            echo "Defconfig spesifik tidak ditemukan!"
            find arch/arm64/configs -maxdepth 2 -type f
            exit 1
          fi

          DEFCONFIG=${DEFCONFIG_PATH#arch/arm64/configs/}
          echo "DEFCONFIG=$DEFCONFIG" >> $GITHUB_ENV
          echo "Menggunakan defconfig: $DEFCONFIG"

          # 3. Terapkan patch NetHunter (Wi-Fi injection & HID gadget)
          patch -p1 --forward < "$GITHUB_WORKSPACE/nh-builder/patches/4.19/add-wifi-injection-4.14.patch" || true
          patch -p1 --forward < "$GITHUB_WORKSPACE/nh-builder/patches/4.19/add-hid-gadget-4.19.patch" || true

          # Bersihkan file .rej jika ada hunk minor yang gagal dan tampilkan lognya
          if find . -name "*.rej" | grep -q .; then
            echo "=== Menangani hunk patch yang reject ==="
            find . -name "*.rej" -exec cat {} +
            find . -name "*.rej" -delete
            find . -name "*.orig" -delete
          fi

          # 4. Generate .config awal
          make -j$(nproc) O=out ARCH=arm64 "$DEFCONFIG"

          # 5. Aktifkan fitur Kali NetHunter
          ./scripts/config --file out/.config \
            -e SYSVIPC \
            -e MODULES \
            -e MODULE_UNLOAD \
            -e CFG80211 \
            -e CFG80211_WEXT \
            -e MAC80211 \
            -e MAC80211_MESH \
            -e USB_GADGET \
            -e USB_CONFIGFS \
            -e USB_CONFIGFS_F_HID \
            -e USB_G_HID \
            -e HID_GENERIC \
            -e USB_HIDDEV \
            -m ATH9K_HTC \
            -m RT2800USB \
            -m RTL8187 \
            -m RTL8XXXU \
            -m BT_HCIBTUSB \
            -m MEDIA_SUPPORT \
            -m MEDIA_SDR_SUPPORT

          make -j$(nproc) O=out ARCH=arm64 olddefconfig

      - name: Compile Kernel
        env:
          ARCH: arm64
          SUBARCH: arm64
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"

          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1

      - name: Package with AnyKernel3
        run: |
          cd "$GITHUB_WORKSPACE"
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel

          sed -i 's/device.name1=.*/device.name1=dandelion/' anykernel/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=blossom/' anykernel/anykernel.sh
          sed -i 's|block=.*|block=/dev/block/by-name/boot;|' anykernel/anykernel.sh

          BOOT_DIR="$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot"
          if [ -f "$BOOT_DIR/Image.gz-dtb" ]; then
            cp "$BOOT_DIR/Image.gz-dtb" anykernel/
          elif [ -f "$BOOT_DIR/Image.gz" ]; then
            cp "$BOOT_DIR/Image.gz" anykernel/
            [ -f "$BOOT_DIR/dtb.img" ] && cp "$BOOT_DIR/dtb.img" anykernel/
            [ -f "$BOOT_DIR/dtbo.img" ] && cp "$BOOT_DIR/dtbo.img" anykernel/
          else
            echo "File kernel image tidak ditemukan!"
            ls -la "$BOOT_DIR"
            exit 1
          fi

          cd anykernel
          zip -r9 "$GITHUB_WORKSPACE/NetHunter-Kernel-Redmi9A-4.19.zip" * -x .git README.md *placeholder

      - name: Upload NetHunter Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-Kernel-Redmi9A
          path: NetHunter-Kernel-Redmi9A-4.19.zip
          retention-days: 14
