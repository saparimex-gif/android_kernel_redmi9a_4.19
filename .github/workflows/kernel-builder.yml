name: Build NetHunter Kernel Redmi 9A

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libelf-dev libssl-dev zip python3

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          path: kernel

      - name: Clone Proton Clang
        run: git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Compile kernel
        env:
          ARCH: arm64
          SUBARCH: arm64
        run: |
          cd kernel
          make -j$(nproc) O=out dandelion_defconfig
          make -j$(nproc) O=out \
            CC="../clang/bin/clang" \
            CLANG_TRIPLE="aarch64-linux-gnu-" \
            CROSS_COMPILE="../clang/bin/aarch64-linux-gnu-" \
            CROSS_COMPILE_ARM32="../clang/bin/arm-linux-gnueabi-"

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          cp kernel/out/arch/arm64/boot/Image.gz-dtb anykernel/
          cd anykernel
          zip -r9 ../NetHunter-dandelion.zip * -x .git README.md

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-Kernel-Redmi9A
          path: NetHunter-dandelion.zip
