name: Build Pure Linux Boot Image (Dandelion)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Toolchain & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            bc bison flex libssl-dev libelf-dev cpio gzip wget curl python3 git device-tree-compiler

      - name: Build Initramfs & Custom Init
        run: |
          chmod +x build_initramfs.sh
          ./build_initramfs.sh

      - name: Clone Xiaomi Dandelion Kernel Source (Linux 4.9)
        run: |
          git clone --depth=1 https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git -b dandelion-q-oss kernel

      - name: Configure Kernel for Pure Linux (Non-Android)
        working-directory: kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # Pakai defconfig bawaan dandelion sebagai dasar driver hardware MT6762G
          make dandelion_defconfig
          
          # Aktifkan fitur wajib Linux murni (devtmpfs, framebuffer console, USB Gadget RNDIS)
          ./scripts/config --enable CONFIG_DEVTMPFS
          ./scripts/config --enable CONFIG_DEVTMPFS_MOUNT
          ./scripts/config --enable CONFIG_VT
          ./scripts/config --enable CONFIG_VT_CONSOLE
          ./scripts/config --enable CONFIG_FRAMEBUFFER_CONSOLE
          ./scripts/config --enable CONFIG_USB_CONFIGFS
          ./scripts/config --enable CONFIG_USB_CONFIGFS_RNDIS
          
          # Matikan fitur khusus Android yang tidak dipakai (SELinux & Android Paranoid Network)
          ./scripts/config --disable CONFIG_SECURITY_SELINUX
          ./scripts/config --disable CONFIG_ANDROID_PARANOID_NETWORK
          
          make olddefconfig

      - name: Compile Kernel Image & DTB
        working-directory: kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make -j$(nproc) Image.gz-dtb

      - name: Upload Build Artifacts (Kernel + Initramfs)
        uses: actions/upload-artifact@v4
        with:
          name: dandelion-pure-linux-stage1
          path: |
            kernel/arch/arm64/boot/Image.gz-dtb
            initramfs.cpio.gz
