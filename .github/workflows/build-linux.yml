name: Build postmarketOS for Redmi 9A (dandelion)

on:
  workflow_dispatch:

jobs:
  build-pmos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 openssl sudo udev kpartx qemu-user qemu-user-binfmt binfmt-support
          sudo systemctl restart systemd-binfmt || true

      - name: Clone pmbootstrap and pmaports
        run: |
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git ~/pmbootstrap
          mkdir -p ~/.local/var/pmbootstrap/cache_git
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmaports.git \
            ~/.local/var/pmbootstrap/cache_git/pmaports

      - name: Create device-xiaomi-dandelion package
        run: |
          DEV_DIR="$HOME/.local/var/pmbootstrap/cache_git/pmaports/device/testing/device-xiaomi-dandelion"
          mkdir -p "$DEV_DIR"
          cat <<'EOF' > "$DEV_DIR/APKBUILD"
          pkgname=device-xiaomi-dandelion
          pkgver=0.1
          pkgrel=0
          pkgdesc="Xiaomi Redmi 9A (dandelion)"
          arch="aarch64"
          license="MIT"
          depends="postmarketos-base mkbootimg"
          makedepends="devicepkg-dev"
          source=""

          build() {
              devicepkg_build $startdir $pkgname
          }

          package() {
              devicepkg_package $startdir $pkgname
          }
          EOF
          cat <<'EOF' > "$DEV_DIR/deviceinfo"
          deviceinfo_format_version="0"
          deviceinfo_name="Xiaomi Redmi 9A"
          deviceinfo_codename="dandelion"
          deviceinfo_manufacturer="Xiaomi"
          deviceinfo_arch="aarch64"
          deviceinfo_chassis="handset"
          deviceinfo_flash_methods="fastboot"
          deviceinfo_bootimg_qcdt="false"
          deviceinfo_bootimg_mtk_mkimage="false"
          deviceinfo_generate_bootimg="true"
          deviceinfo_header_version="2"
          deviceinfo_kernel_cmdline="bootopt=64S3,32N2,64N2 androidboot.selinux=permissive"
          deviceinfo_flash_pagesize="2048"
          deviceinfo_flash_offset_base="0x40078000"
          deviceinfo_flash_offset_kernel="0x00008000"
          deviceinfo_flash_offset_ramdisk="0x07c08000"
          deviceinfo_flash_offset_second="0x00f00000"
          deviceinfo_flash_offset_tags="0x0bc08000"
          EOF

      - name: Build postmarketOS image
        run: |
          cd ~/pmbootstrap
          ./pmbootstrap.py -y config device xiaomi-dandelion
          ./pmbootstrap.py -y config ui console
          ./pmbootstrap.py -y config hostname redmi9a
          ./pmbootstrap.py -y config user user
          ./pmbootstrap.py -y install --password 1234
          mkdir -p /tmp/pmos-out
          ./pmbootstrap.py export --symlink /tmp/pmos-out
          ls -lh /tmp/pmos-out

      - name: Upload exported images
        uses: actions/upload-artifact@v4
        with:
          name: pmos-dandelion-images
          path: /tmp/pmos-out/*
