name: Build Pure Linux Stage 1 - Redmi 9A (4.19)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache cpio curl flex git gzip libelf-dev libssl-dev lld llvm python3 python-is-python3 unzip wget zip zlib1g-dev zstd

      - name: Build Initramfs
        run: |
          chmod +x build_initramfs.sh
          ./build_initramfs.sh

      - name: Clone Kernel Source 4.19
        run: |
          git clone --depth=1 --single-branch https://github.com/IsHacker-kernel/android_kernel_xiaomi_blossom.git kernel

      - name: Clone AOSP Clang Toolchain
        run: |
          git clone --depth=1 --single-branch https://github.com/IsHacker-kernel/toolchain_aosp_clang.git clang

      - name: Prepare Defconfig for Pure Linux
        env:
          ARCH: arm64
          SUBARCH: arm64
        run: |
          cd kernel
          if [ ! -f "drivers/android/lowmemorykiller.c" ] && [ -f "drivers/android/Makefile" ]; then
            sed -i '/lowmemorykiller\.o/d' drivers/android/Makefile
          fi
          DEFCONFIG_PATH=$(find arch/arm64/configs -type f \( -name "*blossom*defconfig" -o -name "*dandelion*defconfig" -o -name "*mt6765*defconfig" \) | head -n 1)
          DEFCONFIG=${DEFCONFIG_PATH#arch/arm64/configs/}
          echo "Menggunakan defconfig: $DEFCONFIG"
          yes "n" | make -j$(nproc) O=out ARCH=arm64 "$DEFCONFIG"
          ./scripts/config --file out/.config -d LTO_CLANG -d CONFIG_LTO_CLANG -d RELR -d CONFIG_RELR -d ANDROID_LOW_MEMORY_KILLER -d CONFIG_ANDROID_LOW_MEMORY_KILLER -d IOSCHED_DEADLINE -d CONFIG_IOSCHED_DEADLINE -d SECURITY_SELINUX -d CONFIG_SECURITY_SELINUX -d ANDROID_PARANOID_NETWORK -d CONFIG_ANDROID_PARANOID_NETWORK -e DEVTMPFS -e DEVTMPFS_MOUNT -e VT -e VT_CONSOLE -e FRAMEBUFFER_CONSOLE -e USB_GADGET -e USB_CONFIGFS -e USB_CONFIGFS_RNDIS -e IKCONFIG -e IKCONFIG_PROC
          sed -i 's/^CONFIG_ANDROID_LOW_MEMORY_KILLER=.*/# CONFIG_ANDROID_LOW_MEMORY_KILLER is not set/' out/.config
          sed -i 's/^CONFIG_IOSCHED_DEADLINE=.*/# CONFIG_IOSCHED_DEADLINE is not set/' out/.config
          sed -i 's/^CONFIG_SECURITY_SELINUX=.*/# CONFIG_SECURITY_SELINUX is not set/' out/.config
          sed -i 's/^CONFIG_ANDROID_PARANOID_NETWORK=.*/# CONFIG_ANDROID_PARANOID_NETWORK is not set/' out/.config
          yes "n" | make -j$(nproc) O=out ARCH=arm64 olddefconfig || true

      - name: Compile Kernel for Pure Linux
        env:
          ARCH: arm64
          SUBARCH: arm64
        run: |
          cd kernel
          CLANG_BIN=$(find "$GITHUB_WORKSPACE/clang" -maxdepth 4 -type f -name "clang" | head -n 1 | xargs dirname)
          export PATH="$CLANG_BIN:$PATH"
          make -j$(nproc) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1

      - name: Collect and Upload Artifacts
        run: |
          mkdir -p "$GITHUB_WORKSPACE/stage1_out"
          BOOT_DIR="$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot"
          if [ -f "$BOOT_DIR/Image.gz-dtb" ]; then
            cp "$BOOT_DIR/Image.gz-dtb" "$GITHUB_WORKSPACE/stage1_out/Image.gz-dtb"
          elif [ -f "$BOOT_DIR/Image.gz" ] && [ -f "$BOOT_DIR/dtb.img" ]; then
            cat "$BOOT_DIR/Image.gz" "$BOOT_DIR/dtb.img" > "$GITHUB_WORKSPACE/stage1_out/Image.gz-dtb"
          elif [ -f "$BOOT_DIR/Image.gz" ]; then
            cp "$BOOT_DIR/Image.gz" "$GITHUB_WORKSPACE/stage1_out/Image.gz-dtb"
          else
            echo "File kernel image tidak ditemukan!"
            exit 1
          fi
          cp "$GITHUB_WORKSPACE/initramfs.cpio.gz" "$GITHUB_WORKSPACE/stage1_out/initramfs.cpio.gz"
          ls -lh "$GITHUB_WORKSPACE/stage1_out/"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dandelion-pure-linux-stage1-4.19
          path: |
            stage1_out/Image.gz-dtb
            stage1_out/initramfs.cpio.gz
          retention-days: 14
